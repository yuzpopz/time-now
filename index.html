<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.svg" type="image/svg+xml">
    <title>Digital Clock</title>
</head>
<body>
    <div id="clock">
        <div class="time">
            <span id="h1"></span>
            <span id="h2"></span>
            <span id="sep">:</span>
            <span id="m1"></span>
            <span id="m2"></span>
            <span id="sep-s">:</span>
            <span id="s1"></span>
            <span id="s2"></span>
        </div>
    </div>
    <div class="controls">
        <button id="toggleSeconds">Hide seconds</button>

        <div class="toggle-switch1">
            <input type="checkbox" id="darkModeToggle">
            <label class="switch1" for="darkModeToggle"></label>
        </div>
        <div id="darkModeText">Dark mode</div>

        <div class="toggle-switch2">
            <input type="checkbox" id="fullScreenToggle">
            <label class="switch2" for="fullScreenToggle"></label>
        </div>
        <span id="fullScreenText">Full screen</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
